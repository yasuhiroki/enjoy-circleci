version: 2.1

commands:
  command_1:
    parameters:
      VAR:
        type: string
    steps:
      - run: echo $VAR

jobs:
  job_1:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo $VAR
      - command_1:
          VAR: $VAR

      - run: |
          VAR="can you see?"
          echo $VAR
      - run: echo $VAR
      - command_1:
          VAR: $VAR

      - run: |
          export VAR="can you see?"
          echo $VAR
      - run: echo $VAR
      - command_1:
          VAR: $VAR

workflows:
  workflow_1:
    jobs:
      - job_1
